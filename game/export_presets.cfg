; Export presets for tools/CI (Wave 3D). Export from the repository root with:
;   godot --headless --path game --export-release "Linux x86_64" ../builds/linux/dcc-game
;   godot --headless --path game --export-release "Windows x86_64" ../builds/windows/dcc-game.exe
; Needs the Godot 4.7.2 export templates; see .github/workflows/godot-export.yml.
; Builds land in builds/ (git-ignored). The PCK is embedded in each binary.

[preset.0]

name="Linux x86_64"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*"
export_path="../builds/linux/dcc-game"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

